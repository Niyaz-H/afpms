{% extends 'core/base.html' %}

{% block title %}{% if form.instance.pk %}Edit Product{% else %}Create Product{% endif %}{% endblock %}

{% block content %}
    <div class="bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4">{% if form.instance.pk %}Edit Product{% else %}Create Product{% endif %}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Save</button>
        </form>
    </div>
{% endblock %}
