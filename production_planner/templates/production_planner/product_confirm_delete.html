{% extends 'core/base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
    <div class="bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4">Confirm Delete</h1>
        <p>Are you sure you want to delete "{{ object }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 mt-4">Confirm</button>
            <a href="{% url 'production_planner:batch-list' %}" class="text-gray-500 ml-4">Cancel</a>
        </form>
    </div>
{% endblock %}
